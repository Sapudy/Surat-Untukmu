<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff0f5">
    <title>Pesan Spesial | Web Gabut</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #3b1e2e;
            background:
                radial-gradient(ellipse at 12% 18%, rgba(251, 146, 180, 0.38), transparent 32%),
                radial-gradient(ellipse at 88% 82%, rgba(196, 181, 253, 0.58), transparent 35%),
                linear-gradient(135deg, #fff1f2 0%, #fdf2f8 52%, #f5f3ff 100%);
            font-family: Inter, 'Segoe UI', Arial, sans-serif;
        }

        .card {
            width: min(100%, 460px);
            padding: 42px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.84);
            box-shadow: 0 24px 70px rgba(49, 46, 129, 0.15);
            text-align: center;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            animation: appear 600ms ease both;
        }

        .brand {
            display: grid;
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            place-items: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #fb7185, #a855f7);
            box-shadow: 0 10px 24px rgba(124, 58, 237, 0.25);
            font-size: 34px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #db2777;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 18px;
            color: #3b1e2e;
            font-size: clamp(30px, 8vw, 38px);
            letter-spacing: -1.7px;
            line-height: 1.1;
        }

        .message {
            margin: 0;
            padding: 22px 18px;
            border: 1px solid #f9d4e2;
            border-radius: 18px;
            background: #fff1f5;
            color: #71334f;
            font-size: 17px;
            line-height: 1.7;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #be185d;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin: 24px 0 0;
            color: #9a95aa;
            font-size: 12px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 34px 25px;
                border-radius: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand" aria-hidden="true">💌</div>
        <p class="eyebrow">Pesan spesial buat kamu</p>
        <h1 id="greeting">Hai! 💕</h1>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <a class="back-link" href="index.html">← Buat pesan untuk nama lain</a>
        <p class="footer">Web Gabut · Dibuat khusus untuk bikin senyum ✨</p>
    </main>

    <script>
        const compliments = [
            'Kamu tahu nggak, sejak kenal kamu, definisi hari yang indah jadi punya nama.',
            'Kalau senyum kamu jadi bintang, langit malam pasti kalah terang.',
            'Aku tadinya mau cari kata-kata paling manis, tapi ternyata namamu sudah cukup.',
            'Kamu itu seperti lagu favorit: selalu berhasil bikin hariku ingin diulang.',
            'Katanya jangan melihat seseorang dari penampilannya, tapi susah juga kalau senyummu semenarik itu.'
        ];
        const params = new URLSearchParams(window.location.search);
        const name = (params.get('name') || '').trim();
        const complimentIndex = Number(params.get('compliment'));

        if (!name || !Number.isInteger(complimentIndex) || complimentIndex < 0 || complimentIndex >= compliments.length) {
            window.location.replace('index.html');
        } else {
            document.querySelector('#greeting').textContent = `Hai, ${name}! 💕`;
            document.querySelector('#message').textContent = compliments[complimentIndex];
        }
    </script>
</body>
</html>
